version: '3.8'

services:
  # 1. Base de datos para MS Transaccional
  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_USER: pujaz_user
      POSTGRES_PASSWORD: pujaz_password
      POSTGRES_DB: pujaz_transaccional
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Base de datos para MS Catálogo
  mongo-db:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Microservicio de Catálogo (Python/FastAPI)
  ms-catalogo:
    build:
      context: ./ms-catalogo
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo-db:27017
    depends_on:
      - mongo-db

  # 4. Gateway / BFF (Node.js + GraphQL). Usa clientes falsos hasta conectarse a los MS reales.
  gateway-bff:
    build:
      context: ./gateway-bff
      additional_contexts:
        contrato: ./docs/contrato
    ports:
      - "4000:4000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-}  # Se define en el .env de la raíz (ver .env.example)
      - USE_MOCKS=true
      - MS_CATALOGO_URL=http://ms-catalogo:8000
      - CORS_ORIGIN=http://localhost:5173

  # (Próximamente: ms-transaccional, frontend-spa)

volumes:
  postgres_data:
  mongo_data:
