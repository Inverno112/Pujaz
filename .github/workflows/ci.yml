name: CI Pruebas y Migraciones

on:
  push:
    branches: [ "developcito", "main" ]
  pull_request:
    branches: [ "developcito", "main" ]

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    
    # se levantas las db's limpias en el servidor de GitHub
    services:
      postgres:
        postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pujaz_user
          POSTGRES_PASSWORD: pujaz_password
          POSTGRES_DB: pujaz_transaccional
        ports:
          - 5432:5432
      
      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Instalar Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21' # la versión que se use en el proyecto

    - name: Ejecutar Pruebas de Migraciones
      run: |
        cd ms-transaccional
        go test -v ./...